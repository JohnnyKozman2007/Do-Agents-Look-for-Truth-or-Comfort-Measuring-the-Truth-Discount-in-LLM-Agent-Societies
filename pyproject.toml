[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truth-discount-runner"
version = "0.2.0"
description = "Pilot orchestration, auditable provider receipts and bounded development collection"
requires-python = ">=3.11"
authors = [{name = "Ahmed Tariq"}]

[project.scripts]
truth-discount = "truth_discount.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src", "tests"]
