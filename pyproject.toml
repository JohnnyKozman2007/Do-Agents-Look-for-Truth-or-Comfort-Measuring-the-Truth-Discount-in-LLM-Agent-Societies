[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truth-discount-runner"
version = "0.2.0"
description = "Pilot orchestration, auditable provider receipts and bounded development collection"
requires-python = ">=3.11"
authors = [{name = "Ahmed Tariq"}]

[project.optional-dependencies]
# Only `analyze` uses these: the mixed-effects model and the chart. The runner stays stdlib-only.
analysis = ["statsmodels>=0.14", "pandas>=2.0", "matplotlib>=3.7"]

[project.scripts]
truth-discount = "truth_discount.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src", "tests"]
